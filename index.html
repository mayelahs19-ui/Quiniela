function eqI(id){return EQ.find(e=>e.id===id)||{flag:'',n:id};}
function perDe(id){
  for(const[p,eqs]of Object.entries(SORTEO))if(eqs.includes(id))return p;
  return null;
}

// Equipos que clasificaron a dieciseisavos (aparecen en D16)
function equiposClasificados(){
  const s=new Set();
  [...D16,...OCT,...CUA,...SEM,...FIN].forEach(p=>{
    if(!p.e1.startsWith('G')&&!p.e1.startsWith('P')) s.add(p.e1);
    if(!p.e2.startsWith('G')&&!p.e2.startsWith('P')) s.add(p.e2);
  });
  return s;
}

// ¿Este equipo ya quedó eliminado del torneo?
function equipoEliminado(id){
  const clasificados=equiposClasificados();
  if(!clasificados.has(id)) return true; // no clasificó a dieciseisavos
  // Buscar TODOS los partidos del equipo en rondas eliminatorias
  const todas=[...D16,...OCT,...CUA,...SEM,...FIN];
  const partidos_eq=todas.filter(p=>p.e1===id||p.e2===id);
  // Si no tiene partidos o ninguno está jugado, no eliminado aún
  const jugados=partidos_eq.filter(p=>p.g1!==null&&p.g2!==null);
  if(jugados.length===0) return false;
  // Revisar el último partido jugado
  const ultimo=jugados[jugados.length-1];
  const a=parseInt(ultimo.g1),b=parseInt(ultimo.g2);
  let ganador=null;
  if(a>b) ganador=ultimo.e1;
  else if(b>a) ganador=ultimo.e2;
  else if(ultimo.pen) ganador=(ultimo.pen[0]>ultimo.pen[1])?ultimo.e1:ultimo.e2;
  return ganador!==null && ganador!==id;
}

// ¿Esta persona ya quedó eliminada? (TODOS sus equipos fuera)
function personaEliminada(persona){
  const eqs=SORTEO[persona]||[];
  if(eqs.length===0) return false;
  return eqs.every(id=>equipoEliminado(id));
}

function renderRonda(arr, elId, titulo){
  const dl=document.getElementById(elId);if(!dl)return;
  // Resolver nombres de equipos (pueden ser "G89", "P101", etc.)
  function resolverEq(code){
    // Si es código directo de equipo, usar eqI
    if(!code.startsWith('G')&&!code.startsWith('P')) return eqI(code);
    // Si aún usa código dinámico, intentar resolver
    const pid=parseInt(code.slice(1));
    const todas=[...D16,...OCT,...CUA,...SEM,...FIN];
    const p=todas.find(x=>x.id===pid);
    if(!p||p.g1===null||p.g2===null) return {flag:'⏳',n:'Por definir'};
    const a=parseInt(p.g1),b=parseInt(p.g2);
    let ganE=null;
    if(code.startsWith('G')){
      if(a>b) ganE=p.e1;
      else if(b>a) ganE=p.e2;
      else if(p.pen) ganE=(p.pen[0]>p.pen[1])?p.e1:p.e2;
    } else {
      if(a<b) ganE=p.e1;
      else if(b<a) ganE=p.e2;
      else if(p.pen) ganE=(p.pen[0]<p.pen[1])?p.e1:p.e2;
    }
    return ganE?eqI(ganE):{flag:'⏳',n:'Por definir'};
  }
  const porFecha={};
  arr.forEach(p=>{
    if(!porFecha[p.f])porFecha[p.f]=[];
    porFecha[p.f].push(p);
  });
  let html='';
  Object.entries(porFecha).forEach(([fecha,ps])=>{
    html+=`<div class="fecha-sep">${fecha}</div>`;
    ps.forEach(p=>{
      const e1=resolverEq(p.e1),e2=resolverEq(p.e2);
      const per1=perDe(p.e1),per2=perDe(p.e2);
      const j=p.g1!==null&&p.g2!==null;
      let rb='',ph='';
      if(j){
        const a=parseInt(p.g1),b=parseInt(p.g2);
        let ganador=null;
        if(a>b) ganador=p.e1;
        else if(b>a) ganador=p.e2;
        else if(p.pen) ganador=(p.pen[0]>p.pen[1])?p.e1:p.e2;
        const ganNom=ganador===p.e1?e1.n:e2.n;
        const perNom=ganador===p.e1?e2.n:e1.n;
        const perGan=ganador===p.e1?per1:per2;
        const perPer=ganador===p.e1?per2:per1;
        if(ganador){
          rb=`<div class="rbadge rv">✅ ${ganNom} avanza</div>`;
          if(perGan||perPer)ph=`<div class="pesos">${perGan?`<span class="pg">+$10 ${perGan}</span>`:'<span></span>'}${perPer?`<span class="pp2">-$10 ${perPer}</span>`:'<span></span>'}</div>`;
        } else rb=`<div class="rbadge rem">⏳ Empate — esperando penales</div>`;
      } else rb=`<div class="rbadge rp">⏳ ${p.h} CDMX</div>`;
      const sc=j?(p.pen?`<span class="marcador">${p.g1}<span style="font-size:13px">(${p.pen[0]})</span> - ${p.g2}<span style="font-size:13px">(${p.pen[1]})</span></span>`:`<span class="marcador">${p.g1} - ${p.g2}</span>`):`<span class="marcador" style="font-size:13px;color:rgba(255,255,255,.3)">vs</span>`;
      html+=`<div class="pcard">
        <div class="pfecha"><span>${titulo}</span><span class="phora">${p.h} CDMX</span></div>
        <div class="peqs">
          <div class="eblk"><span class="eflag">${e1.flag}</span><div class="ename">${e1.n}</div><div class="epersona ${per1?'tiene':''}">${per1||'—'}</div></div>
          ${sc}
          <div class="eblk"><span class="eflag">${e2.flag}</span><div class="ename">${e2.n}</div><div class="epersona ${per2?'tiene':''}">${per2||'—'}</div></div>
        </div>${rb}${ph}</div>`;
    });
  });
  dl.innerHTML=html||`<div class="loading">Sin partidos definidos aún</div>`;
}

function renderTabla(){
  const tb=document.getElementById('tbody');if(!tb)return;
  const sal={};PERSONAS.forEach(p=>sal[p]={v:0,d:0,s:0});
  partidos.forEach(p=>{
    if(p.g1===null||p.g2===null)return;
    const a=parseInt(p.g1),b=parseInt(p.g2);if(a===b)return;
    const p1=perDe(p.e1),p2=perDe(p.e2);
    const gan=a>b?p1:p2,per=a>b?p2:p1;
    if(gan&&sal[gan]){sal[gan].v++;sal[gan].s+=10;}
    if(per&&sal[per]){sal[per].d++;sal[per].s-=10;}
  });
  D16.forEach(p=>{
    if(p.g1===null||p.g2===null)return;
    const a=parseInt(p.g1),b=parseInt(p.g2);
    let ganE=null,perE=null;
    if(a>b){ganE=p.e1;perE=p.e2;}
    else if(b>a){ganE=p.e2;perE=p.e1;}
    else if(p.pen){ganE=(p.pen[0]>p.pen[1])?p.e1:p.e2;perE=(ganE===p.e1)?p.e2:p.e1;}
    else return;
    const gan=perDe(ganE),per=perDe(perE);
    if(gan&&sal[gan]){sal[gan].v++;sal[gan].s+=10;}
    if(per&&sal[per]){sal[per].d++;sal[per].s-=10;}
  });
  // Sumar saldos de Octavos, Cuartos, Semis y Final
  [...OCT,...CUA,...SEM,...FIN].forEach(p=>{
    if(p.g1===null||p.g2===null)return;
    const a=parseInt(p.g1),b=parseInt(p.g2);
    let ganE=null,perE=null;
    if(a>b){ganE=p.e1;perE=p.e2;}
    else if(b>a){ganE=p.e2;perE=p.e1;}
    else if(p.pen){ganE=(p.pen[0]>p.pen[1])?p.e1:p.e2;perE=(ganE===p.e1)?p.e2:p.e1;}
    else return;
    // Solo contar si el equipo pertenece a alguien del sorteo original
    const gan=perDe(ganE),per=perDe(perE);
    if(gan&&sal[gan]){sal[gan].v++;sal[gan].s+=10;}
    if(per&&sal[per]){sal[per].d++;sal[per].s-=10;}
  });
  const sorted=PERSONAS.map(p=>({p,...sal[p]})).sort((a,b)=>b.s-a.s||b.v-a.v);
  tb.innerHTML=sorted.map((r,i)=>{
    const pc=i===0?'p1':i===1?'p2':i===2?'p3':'';
    const elim=personaEliminada(r.p);
    const rc=elim?'elim':(r.s>0?'gana':r.s<0?'perd':'');
    const sc=r.s>=0?'sp2':'sn3';
    const esN=NINOS.has(r.p);
    const eqs=(SORTEO[r.p]||[]).map(id=>{
      const eq=eqI(id);
      const fuera=equipoEliminado(id);
      return`<span class="eq-chip ${fuera?'eq-fuera':''}">${eq.flag} ${eq.n}${fuera?' ❌':''}</span>`;
    }).join('');
    return`<div class="trow ${rc}">
      <div class="trow-top">
        <span class="pbadge ${pc}">${i+1}</span>
        <span class="tname">${r.p}${esN?'<span class="ntag">niño</span>':''}${elim?'<span class="elimtag">❌ Eliminado</span>':''}</span>
        <span style="text-align:center;color:#4ade80;font-size:12px">${r.v}</span>
        <span style="text-align:center;color:#f87171;font-size:12px">${r.d}</span>
        <span class="${sc}" style="text-align:right;font-size:12px">${r.s>=0?'+':''}$${r.s}</span>
      </div>
      <div class="eq-chips">${eqs}</div>
    </div>`;
  }).join('');
}

function showTab(t){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  const sec=document.getElementById('tab-'+t);if(sec)sec.classList.add('active');
  const btn=document.querySelector(`[onclick="showTab('${t}')"]`);if(btn)btn.classList.add('active');
}
