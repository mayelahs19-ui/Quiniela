function renderContador(){
  document.getElementById('main').innerHTML=`
    <div class="cw">
      <div class="clbl">El sorteo oficial se realizará automáticamente a las</div>
      <div class="cboxes">
        <div class="cbox"><div class="cnum" id="ch">00</div><div class="clb">horas</div></div>
        <div class="csep">:</div>
        <div class="cbox"><div class="cnum" id="cm">00</div><div class="clb">min</div></div>
        <div class="csep">:</div>
        <div class="cbox"><div class="cnum" id="cs">00</div><div class="clb">seg</div></div>
      </div>
      <div class="chora">Hoy <strong>10 de junio · 7:30 PM</strong> hora de Querétaro</div>
      <div class="cpbar"><div class="cpfill" id="cpf" style="width:0%"></div></div>
      <div class="suspense">¡Prepárate para descubrir tus equipos! ⚽</div>
    </div>`;
  tick();
  timer=setInterval(tick,1000);
}

function tick(){
  const now=new Date();
  const diff=SORTEO_TIME-now;
  if(diff<=0){clearInterval(timer);renderSorteando();return;}
  const h=Math.floor(diff/3600000);
  const m=Math.floor((diff%3600000)/60000);
  const s=Math.floor((diff%60000)/1000);
  const ch=document.getElementById('ch');
  const cm=document.getElementById('cm');
  const cs=document.getElementById('cs');
  const cpf=document.getElementById('cpf');
  if(ch)ch.textContent=String(h).padStart(2,'0');
  if(cm)cm.textContent=String(m).padStart(2,'0');
  if(cs)cs.textContent=String(s).padStart(2,'0');
  if(cpf){const el=TOTAL_SECS-(diff/1000);cpf.style.width=Math.min(100,Math.max(0,(el/TOTAL_SECS)*100))+'%';}
}

function renderSorteando(){
  document.getElementById('main').innerHTML=`
    <div class="sorteando">
      <div class="ball-spin">⚽</div>
      <h2>¡Sorteando equipos!</h2>
      <p>Asignando los 48 equipos entre los 22 participantes...</p>
    </div>`;
  setTimeout(()=>{hacerSorteo();renderApp();},3000);
}

function renderApp(){
  const saved_p=localStorage.getItem(PAK);
  if(saved_p)partidos=JSON.parse(saved_p);
  document.getElementById('main').innerHTML=`
    <div class="tabs">
      <button class="tab active" onclick="showTab('s')">⚽ Sorteo</button>
      <button class="tab" onclick="showTab('p')">🗓 Partidos</button>
      <button class="tab" onclick="showTab('t')">🏆 Tabla</button>
    </div>
    <div id="tab-s" class="sec active"><div class="sgrid" id="sgrid"></div></div>
    <div id="tab-p" class="sec">
      <div class="fbrow" id="fgrp"></div>
      <div id="plist"></div>
    </div>
    <div id="tab-t" class="sec">
      <div class="thdr"><span>#</span><span>Nombre</span><span style="text-align:center">V</span><span style="text-align:center">D</span><span style="text-align:right">Saldo</span></div>
      <div id="tbody"></div>
    </div>
    <div class="ley">
      <div class="li"><div class="ld" style="background:#f5a623"></div>Niño</div>
      <div class="li"><div class="ld" style="background:#4ade80"></div>3 equipos</div>
      <div class="li"><div class="ld" style="background:#4ade80;border-radius:50%"></div>Ganando</div>
      <div class="li"><div class="ld" style="background:#f87171;border-radius:50%"></div>Perdiendo</div>
    </div>`;
  renderSorteo();renderPartidos();renderTabla();
}

function renderSorteo(){
  const g=document.getElementById('sgrid');if(!g)return;
  g.innerHTML=PERSONAS.map(p=>{
    const esN=NINOS.has(p),eqs=sorteo[p]||[],esTres=eqs.length===3;
    const tags=eqs.map(id=>{const eq=eqI(id);return`<span class="etag">${eq.flag} ${eq.n}</span>`;}).join('');
    return`<div class="scard ${esN?'nino':''} ${esTres&&!esN?'tres':''}">
      <div class="sname">${p}${esN?'<span class="ntag">niño</span>':''}${esTres?'<span class="x3tag">✨x3</span>':''}</div>
      <div class="seqs">${tags||'—'}</div></div>`;
  }).join('');
}

function renderPartidos(){
  const el=document.getElementById('fgrp');if(!el)return;
  const gs=['Todos','A','B','C','D','E','F','G','H','I','J','K','L'];
  el.innerHTML=gs.map(g=>`<button class="fb ${filtroG===g?'on':''}" onclick="setFG('${g}')">${g}</button>`).join('');

  // Ordenar por fecha
  const dayNum = f => parseInt(f.replace('Jun ',''));
  let fil = filtroG==='Todos' ? [...partidos] : partidos.filter(p=>p.g===filtroG);
  fil.sort((a,b) => dayNum(a.f) - dayNum(b.f));
  const pl=document.getElementById('plist');if(!pl)return;
  pl.innerHTML=fil.map(p=>{
    const e1=eqI(p.e1),e2=eqI(p.e2),per1=perDe(p.e1),per2=perDe(p.e2);
    const j=p.g1!==null&&p.g2!==null;
    let rb='',ph='';
    if(j){
      const a=parseInt(p.g1),b=parseInt(p.g2);
      if(a>b){rb=`<div class="rbadge rv">✅ ${e1.n} gana</div>`;if(per1||per2)ph=`<div class="pesos">${per1?`<span class="pg">+$10 ${per1}</span>`:'<span></span>'}${per2?`<span class="pp2">-$10 ${per2}</span>`:'<span></span>'}</div>`;}
      else if(b>a){rb=`<div class="rbadge rv">✅ ${e2.n} gana</div>`;if(per1||per2)ph=`<div class="pesos">${per2?`<span class="pg">+$10 ${per2}</span>`:'<span></span>'}${per1?`<span class="pp2">-$10 ${per1}</span>`:'<span></span>'}</div>`;}
      else rb=`<div class="rbadge rem">🤝 Empate — sin pago</div>`;
    }else rb=`<div class="rbadge rp">⏳ Pendiente</div>`;
    const sc=j?`<span class="marcador">${p.g1} - ${p.g2}</span>`:`<span class="marcador" style="font-size:13px;color:rgba(255,255,255,.4)">vs</span>`;
    return`<div class="pcard">
      <div class="pfecha">Grupo ${p.g} · ${p.f}</div>
      <div class="peqs">
        <div class="eblk"><span class="eflag">${e1.flag}</span><div class="ename">${e1.n}</div><div class="epersona ${per1?'tiene':''}">${per1||'—'}</div></div>
        ${sc}
        <div class="eblk"><span class="eflag">${e2.flag}</span><div class="ename">${e2.n}</div><div class="epersona ${per2?'tiene':''}">${per2||'—'}</div></div>
      </div>${rb}${ph}</div>`;
  }).join('');
}

function setFG(g){filtroG=g;renderPartidos();}

function renderTabla(){
  const tb=document.getElementById('tbody');if(!tb)return;
  const sal={};PERSONAS.forEach(p=>sal[p]={v:0,d:0,s:0});
  partidos.forEach(p=>{
    if(p.g1===null||p.g2===null)return;
    const a=parseInt(p.g1),b=parseInt(p.g2);if(a===b)return;
    const p1=perDe(p.e1),p2=perDe(p.e2);
    const gan=a>b?p1:p2,per=a>b?p2:p1;
    if(gan&&sal[gan]){sal[gan].v++;sal[gan].s+=10;}
    if(per&&sal[per]){sal[per].d++;sal[per].s-=10;}
  });
  const sorted=PERSONAS.map(p=>({p,...sal[p]})).sort((a,b)=>b.s-a.s||b.v-a.v);
  tb.innerHTML=sorted.map((r,i)=>{
    const pc=i===0?'p1':i===1?'p2':i===2?'p3':'';
    const rc=r.s>0?'gana':r.s<0?'perd':'';
    const sc=r.s>=0?'sp2':'sn3';
    const esN=NINOS.has(r.p);
    const eqs=(sorteo[r.p]||[]).map(id=>{const eq=eqI(id);return`<span class="eq-chip">${eq.flag} ${eq.n}</span>`;}).join('');
    return`<div class="trow ${rc}">
      <div class="trow-top">
        <span class="pbadge ${pc}">${i+1}</span>
        <span class="tname">${r.p}${esN?'<span class="ntag">niño</span>':''}</span>
        <span style="text-align:center;color:#4ade80;font-size:12px">${r.v}</span>
        <span style="text-align:center;color:#f87171;font-size:12px">${r.d}</span>
        <span class="${sc}" style="text-align:right;font-size:12px">${r.s>=0?'+':''}$${r.s}</span>
      </div>
      <div class="eq-chips">${eqs||'<span style="font-size:10px;color:rgba(255,255,255,.3)">Pendiente sorteo</span>'}</div>
    </div>`;
  }).join('');
}

function showTab(t){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  const sec=document.getElementById('tab-'+t);if(sec)sec.classList.add('active');
  const btn=document.querySelector(`[onclick="showTab('${t}')"]`);if(btn)btn.classList.add('active');
}

async function actualizarResultados(){
  const btn=document.getElementById('btn-upd');if(!btn)return;
  btn.textContent='⏳ Consultando resultados...';btn.disabled=true;
  try{
    const resp=await fetch('https://quiniela-proxy.mayelahs19.workers.dev',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,
        messages:[{role:'user',content:`Eres un asistente que conoce los resultados del Mundial FIFA 2026. Hoy es ${new Date().toLocaleDateString('es-MX')}. Dame SOLO un array JSON sin texto extra ni markdown con los partidos que ya tienen resultado final. Formato: [{"id":1,"g1":2,"g2":0}]. IDs: 1=MEX-RSA,2=KOR-CZE,3=MEX-KOR,4=CZE-RSA,5=MEX-CZE,6=RSA-KOR,7=CAN-BIH,8=QAT-SUI,9=CAN-QAT,10=SUI-BIH,11=CAN-SUI,12=BIH-QAT,13=BRA-MAR,14=HAI-SCO,15=BRA-HAI,16=SCO-MAR,17=BRA-SCO,18=MAR-HAI,19=USA-PAR,20=AUS-TUR,21=USA-AUS,22=TUR-PAR,23=USA-TUR,24=PAR-AUS,25=GER-CIV,26=ECU-CUW,27=GER-ECU,28=CIV-CUW,29=GER-CUW,30=ECU-CIV,31=NED-JPN,32=SWE-TUN,33=NED-SWE,34=JPN-TUN,35=NED-TUN,36=SWE-JPN,37=BEL-IRN,38=EGY-NZL,39=BEL-EGY,40=NZL-IRN,41=BEL-NZL,42=IRN-EGY,43=ESP-CPV,44=KSA-URU,45=ESP-KSA,46=URU-CPV,47=ESP-URU,48=CPV-KSA,49=FRA-SEN,50=NOR-IRQ,51=FRA-NOR,52=SEN-IRQ,53=FRA-IRQ,54=SEN-NOR,55=ARG-ALG,56=AUT-JOR,57=ARG-AUT,58=JOR-ALG,59=ARG-JOR,60=ALG-AUT,61=POR-UZB,62=COL-COD,63=POR-COL,64=COD-UZB,65=POR-COD,66=UZB-COL,67=ENG-CRO,68=GHA-PAN,69=ENG-GHA,70=PAN-CRO,71=ENG-PAN,72=GHA-CRO`}]})});
    const data=await resp.json();
    const txt=data.content.filter(c=>c.type==='text').map(c=>c.text).join('');
    const res=JSON.parse(txt.replace(/```json|```/g,'').trim());
    res.forEach(r=>{const p=partidos.find(x=>x.id===r.id);if(p){p.g1=r.g1;p.g2=r.g2;}});
    localStorage.setItem(PAK,JSON.stringify(partidos));
    renderPartidos();renderTabla();
    btn.textContent='✅ Actualizado!';
  }catch(e){btn.textContent='❌ Error — intenta de nuevo';}
  setTimeout(()=>{if(btn){btn.textContent='🔄 Actualizar resultados con IA';btn.disabled=false;}},3000);
}
